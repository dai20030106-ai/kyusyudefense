name: update-data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths: ["fetch_data.py"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        run: python fetch_data.py
      - name: commit
        run: |
          git config user.name "auto-update"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data.json"
          git push
